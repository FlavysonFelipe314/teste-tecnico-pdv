spring.application.name=rota-clara-core
server.port=8080
spring.datasource.url=jdbc:mysql://mysql:3306/rota_clara
spring.datasource.username=${DB_USER:rota_clara}
spring.datasource.password=${DB_PASSWORD:lab-only-password}
spring.datasource.hikari.maximum-pool-size=10
spring.flyway.enabled=true
spring.data.redis.host=redis
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.username=rota_clara
spring.rabbitmq.password=lab-only-password
eureka.client.service-url.defaultZone=http://eureka:8761/eureka/
eureka.client.fetch-registry=false
eureka.instance.instance-id=rota-clara-core:brisa27-lab
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.client.initial-instance-info-replication-interval-seconds=5
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
lab.fiscal-url=http://fiscal-simulado:8090
lab.s3-endpoint=http://minio:9000
lab.s3-bucket=rota-clara-documentos
lab.s3-user=rota_clara
lab.s3-password=lab-only-password

# Optional dependencies must not make receiving or database fallback unavailable.
management.health.redis.enabled=false
management.health.rabbit.enabled=false
spring.data.redis.connect-timeout=250ms
spring.data.redis.timeout=250ms
lab.documents.worker-enabled=${DOCUMENT_WORKER_ENABLED:true}
lab.documents.poll-ms=1000
lab.documents.max-attempts=5
lab.documents.lease-seconds=30
lab.documents.retry-seconds=2
lab.needs.ttl-seconds=60
lab.needs.cache-enabled=true
